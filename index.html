<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Braxton OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1 id="os-name">Braxton OS</h1>
        <p id="os-tagline" class="muted"></p>
      </div>
    </div>
    <div class="actions">
      <button id="export-btn" class="ghost">Export data</button>
      <label class="ghost button">Import file<input id="import-file" type="file" accept=".json,.js" hidden></label>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="memory">Memory</button>
    <button data-view="goals">Goals</button>
    <button data-view="projects">Projects</button>
    <button data-view="tasks">Tasks</button>
    <button data-view="habits">Habits</button>
    <button data-view="notes">Notes</button>
  </nav>

  <main id="view"></main>

  <script src="data/os-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
